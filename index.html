<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VOXEL VOID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a0b1d;
  --void-2:#131634;
  --panel:#1b1f42;
  --panel-hi:#2b3168;
  --line:#000;
  --ink:#e8ecff;
  --ink-dim:#9aa3d0;
  --krovax:#ff6b2b;
  --zylith:#2fd4ff;
  --mycor:#8bf03a;
  --gold:#ffd24a;
  --danger:#ff3b5c;
  --f:var(--zylith);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);
  font-family:"Chakra Petch",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{touch-action:none}
h1,h2,h3,.px{font-family:"Press Start 2P",ui-monospace,monospace;line-height:1.4;letter-spacing:.02em}
canvas{display:block}
#bg{position:fixed;inset:0;z-index:0}
#app{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}

#rotateWarning{
  position:fixed;inset:0;z-index:9999;background:#0a0b1d;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:16px;
}
#rotateWarning .icon{font-size:42px;animation:rot 2s infinite ease-in-out}
#rotateWarning p{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);line-height:1.8}
@keyframes rot{0%,10%{transform:rotate(0deg)}50%,60%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
@media (orientation: portrait){#rotateWarning{display:flex}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(10px,2vw,24px);gap:12px;overflow-y:auto}
.screen.on{display:flex}

.blk{background:var(--panel);border:3px solid var(--line);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.09), inset 0 -3px 0 rgba(0,0,0,.35), 4px 4px 0 rgba(0,0,0,.55)}
.btn{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--ink);cursor:pointer;
  background:var(--panel-hi);border:3px solid var(--line);padding:10px 16px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14), inset 0 -4px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.5);
  transition:transform .06s steps(2), background .12s}
.btn:hover{background:#39408a;transform:translate(-1px,-1px)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--f);color:#0b0b1a}
.btn.ghost{background:transparent;box-shadow:none;border-color:#454b8f;font-size:9px;padding:8px 10px}
.btn:disabled{opacity:.35;cursor:not-allowed}

#title{text-align:center;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:6px}
#title .mark{font-size:clamp(22px,4.5vw,44px);color:#fff;text-shadow:0 4px 0 #000, 0 0 24px rgba(47,212,255,.5)}
#title .mark span:nth-child(1){color:var(--krovax)}
#title .mark span:nth-child(2){color:var(--zylith)}
#title .sub{font-size:clamp(8px,1.2vw,11px);color:var(--gold)}
#title p{color:var(--ink-dim);max-width:48ch;font-size:13px;line-height:1.4;margin:4px 0}
.menu{display:flex;flex-direction:row;gap:12px;margin-top:6px}

.head{width:min(900px,100%);display:flex;align-items:center;gap:12px}
.head h2{font-size:13px}
.head .step{font-size:9px;color:var(--ink-dim);font-family:"Press Start 2P",monospace}
.spacer{flex:1}

.factions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(960px,100%)}
.fcard{padding:0;cursor:pointer;text-align:left;overflow:hidden}
.fcard .crest{height:50px;display:flex;align-items:center;justify-content:center;font-size:28px;
  border-bottom:2px solid var(--line)}
.fcard .body{padding:8px 10px}
.fcard h3{font-size:11px;margin-bottom:4px}
.fcard .desc{font-size:11px;line-height:1.35;color:#c6cdf3}
.fcard.sel{outline:3px solid var(--gold);outline-offset:-3px}

.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(900px,100%);max-height:76vh}
.stage{position:relative;min-height:200px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 0%, #242b63 0%, #10122c 55%, #08091a 100%)}
.stage canvas{width:100%;height:100%}
.pane{padding:10px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:72vh}
.row label{display:block;font-size:9px;font-family:"Press Start 2P",monospace;color:var(--ink-dim);margin-bottom:6px}
.swatches,.opts{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border:2px solid #000;cursor:pointer}
.sw.sel{outline:2px solid var(--gold);outline-offset:2px}
.opt{padding:6px 10px;font-size:11px;background:#232853;border:2px solid #000;cursor:pointer}
.opt.sel{background:var(--f);color:#0b0b1a;font-weight:700}
input[type=text]{width:100%;background:#0e1030;border:2px solid #000;color:var(--ink);padding:6px 8px;font-size:13px}

.hulls{display:flex;gap:8px}
.hull{flex:1;padding:8px;background:#232853;border:2px solid #000;cursor:pointer;text-align:center}
.hull .n{font-size:9px;font-family:"Press Start 2P",monospace;display:block;margin-bottom:4px}
.hull.sel{background:var(--f);color:#0b0b1a}
.stats{display:flex;flex-direction:column;gap:5px}
.stat{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:6px;font-size:10px}
.bar{height:10px;background:#0c0e26;border:1px solid #000;position:relative}
.bar i{position:absolute;inset:0;width:0;background:var(--f)}
.stat .v{text-align:right;font-family:"Press Start 2P",monospace;font-size:8px}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(900px,100%)}
.mcard{padding:12px;cursor:pointer;text-align:left}
.mcard h3{font-size:10px;margin-bottom:6px;color:var(--gold)}
.mcard p{font-size:11px;color:#c2c9ef;line-height:1.4}

/* HUD & JOYSTICK */
#hud{position:fixed;inset:0;z-index:3;display:none;pointer-events:none}
#hud.on{display:block}
.hbars{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:180px;pointer-events:none}
.hbars .lbl{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--ink-dim);margin-bottom:2px;text-align:center}
.hbars .bar{height:8px;margin-bottom:3px}
#bHull i{background:var(--mycor)}
#bShield i{background:var(--zylith)}

/* JOYSTICK TÁCTIL (IZQUIERDA) */
#stickArea{
  position:absolute;left:18px;bottom:18px;width:150px;height:150px;
  pointer-events:auto;touch-action:none;
}
#stickBase{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(20,24,55,0.65);border:3px solid rgba(255,255,255,0.25);
  box-shadow:inset 0 0 16px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5);
}
#stickKnob{
  position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-32px 0 0 -32px;
  border-radius:50%;background:var(--panel-hi);border:3px solid var(--gold);
  box-shadow:0 3px 6px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.3);
  pointer-events:none;transform:translate3d(0,0,0);
}

/* BOTONERA ACCIÓN (DERECHA) */
.action-box{
  position:absolute;right:18px;bottom:18px;width:160px;height:150px;
  pointer-events:auto;
}
.btn-act{
  position:absolute;border-radius:50%;border:3px solid #000;color:#fff;
  font-family:"Press Start 2P",monospace;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 3px 0 rgba(255,255,255,0.3), 3px 3px 0 #000;touch-action:none;
}
.btn-act:active, .btn-act.down{transform:scale(0.92);box-shadow:none}

#btnShoot{right:6px;bottom:26px;width:76px;height:76px;background:var(--danger);font-size:10px}
#btnTurbo{left:6px;bottom:4px;width:54px;height:54px;background:#c29015;font-size:8px}
#btnHeal{top:4px;left:42px;width:52px;height:52px;background:#2b3168;border-color:var(--gold);color:var(--gold);font-size:7px}

#tQuit{position:absolute;right:16px;top:16px;font-size:8px;padding:6px 10px;pointer-events:auto;
  background:rgba(27,31,66,0.85);border:2px solid #000;color:#fff;font-family:"Press Start 2P",monospace}

.objective{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;
  background:rgba(9,11,32,.85);border:2px solid #000;padding:4px 12px;pointer-events:none}
.objective .t{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--gold)}
.objective .s{font-size:10px;color:#cdd4f7}

.crosshair{
  position:absolute;left:50%;top:46%;width:24px;height:24px;
  transform:translate(-50%,-50%);pointer-events:none;
}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:rgba(255,255,255,0.85)}
.crosshair::before{left:10px;top:0;width:4px;height:24px}
.crosshair::after{top:10px;left:0;height:4px;width:24px}

.marker{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--danger);display:none;pointer-events:none}
.marker.pick{border-color:var(--gold)}
.marker .d{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:8px;font-family:"Press Start 2P",monospace;color:#fff}
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:5;background:rgba(9,11,32,.95);
  border:2px solid var(--gold);padding:8px 14px;font-family:"Press Start 2P",monospace;font-size:9px;color:var(--gold);display:none}
</style>
</head>
<body>

<div id="rotateWarning">
  <div class="icon">📱</div>
  <p>GIRA TU TELÉFONO<br>A MODO HORIZONTAL<br>PARA JUGAR</p>
</div>

<canvas id="bg"></canvas>
<canvas id="game" style="position:fixed;inset:0;z-index:1;display:none"></canvas>
<div id="toast" class="toast"></div>

<div id="hud">
  <button id="tQuit">X</button>
  
  <div class="objective"><div class="t" id="objT">OBJETIVO</div><div class="s" id="objS"></div></div>
  <div class="crosshair"></div>
  
  <div class="hbars">
    <div class="lbl">CASCO <span id="hullTxt"></span></div>
    <div class="bar" id="bHull"><i></i></div>
    <div class="lbl">ESCUDO <span id="shTxt"></span></div>
    <div class="bar" id="bShield"><i></i></div>
  </div>

  <!-- JOYSTICK VIRTUAL -->
  <div id="stickArea">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>

  <!-- BOTONES ACCIÓN -->
  <div class="action-box">
    <div class="btn-act" id="btnHeal">PODER</div>
    <div class="btn-act" id="btnTurbo">TURBO</div>
    <div class="btn-act" id="btnShoot">FUEGO</div>
  </div>
</div>

<div id="app">
  <!-- PORTADA -->
  <section class="screen on" id="scTitle">
    <div id="title">
      <div class="mark px"><span>VOXEL</span> <span>VOID</span></div>
      <div class="sub px">Guerra de las Tres Semillas</div>
      <p>Joystick a la izquierda para pilotar. Botones a la derecha para combatir.</p>
      <div class="menu">
        <button class="btn primary" data-go="faction">Empezar</button>
        <button class="btn" data-go="faction" data-quick="1">Partida Rápida</button>
      </div>
    </div>
  </section>

  <!-- FACCIÓN -->
  <section class="screen" id="scFaction">
    <div class="head">
      <div><div class="step">1 / 4</div><h2>Elige tu especie</h2></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-go="title">Volver</button>
    </div>
    <div class="factions" id="factionList"></div>
    <button class="btn primary" id="toPilot" disabled>Continuar</button>
  </section>

  <!-- PILOTO -->
  <section class="screen" id="scPilot">
    <div class="head">
      <div><div class="step">2 / 4</div><h2>Tu Piloto</h2></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-go="faction">Volver</button>
    </div>
    <div class="editor">
      <div class="blk stage" id="stagePilot"><canvas id="cvPilot"></canvas></div>
      <div class="blk pane">
        <div class="row"><label>Nombre</label><input type="text" id="pName" maxlength="12" value="PILOTO"></div>
        <div class="row"><label>Piel</label><div class="swatches" id="swSkin"></div></div>
        <div class="row"><label>Casco</label><div class="opts" id="opHelm"></div></div>
        <button class="btn primary" data-go="ship">Continuar</button>
      </div>
    </div>
  </section>

  <!-- NAVE -->
  <section class="screen" id="scShip">
    <div class="head">
      <div><div class="step">3 / 4</div><h2>Tu Nave</h2></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-go="pilot">Volver</button>
    </div>
    <div class="editor">
      <div class="blk stage" id="stageShip"><canvas id="cvShip"></canvas></div>
      <div class="blk pane">
        <div class="row"><label>Casco</label><div class="hulls" id="hullList"></div></div>
        <div class="row"><label>Rendimiento</label><div class="stats" id="statList"></div></div>
        <button class="btn primary" data-go="mode">Continuar al despliegue</button>
      </div>
    </div>
  </section>

  <!-- MODO -->
  <section class="screen" id="scMode">
    <div class="head">
      <div><div class="step">4 / 4</div><h2>Despliegue</h2></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-go="ship">Volver</button>
    </div>
    <div class="modes" id="modeList"></div>
  </section>

  <!-- RESULTADO -->
  <section class="screen" id="scResult">
    <div class="blk card" style="padding:20px;text-align:center;max-width:440px">
      <h2 id="rTitle" style="font-size:16px;margin-bottom:12px"></h2>
      <div class="menu" style="justify-content:center">
        <button class="btn primary" id="rAgain">Volver a jugar</button>
        <button class="btn ghost" data-go="mode">Cambiar modo</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

const FACTIONS = {
  krovax:{ id:'krovax', name:'KROVAX', crest:'⛰', desc:'Acorazados y potentes.', css:'#ff6b2b', hex:0xff6b2b, hex2:0x4a1f14, hex3:0xffb03a,
    mods:{casco:1.2, escudo:0.8, dano:1.1, vel:0.95, giro:0.92}, ability:{name:'EMBESTIDA', cd:10}, strong:'mycor', weak:'zylith' },
  zylith:{ id:'zylith', name:'ZYLITH', crest:'◈', desc:'Escudos altos y veloces.', css:'#2fd4ff', hex:0x2fd4ff, hex2:0x13315c, hex3:0xffffff,
    mods:{casco:0.9, escudo:1.35, dano:1.0, vel:1.08, giro:1.08}, ability:{name:'PULSO', cd:9}, strong:'krovax', weak:'mycor' },
  mycor:{ id:'mycor', name:'MYCOR', crest:'❦', desc:'Regeneración y agilidad.', css:'#8bf03a', hex:0x8bf03a, hex2:0x1e3a1a, hex3:0xe6ff9b,
    mods:{casco:1.05, escudo:1.0, dano:0.95, vel:1.05, giro:1.02}, ability:{name:'CURA', cd:11}, strong:'zylith', weak:'krovax' }
};
const FKEYS = ['krovax','zylith','mycor'];

const HULLS = {
  escarabajo:{ id:'escarabajo', name:'ESCARABAJO', role:'Equilibrada', base:{vel:28, giro:1.6, dano:12, cad:3.6, casco:130, escudo:60} },
  martillo:{ id:'martillo', name:'MARTILLO', role:'Pesada', base:{vel:22, giro:1.2, dano:16, cad:2.4, casco:190, escudo:45} },
  aguja:{ id:'aguja', name:'AGUJA', role:'Rápida', base:{vel:36, giro:2.0, dano:9, cad:5.0, casco:90, escudo:70} }
};
const HKEYS = ['escarabajo','martillo','aguja'];

const SKINS  = [0xf0c39a,0xa06a43,0x8fd6c0,0xc9a2e0];
const HELMS  = [0xdfe4f5,0xff6b2b,0x2fd4ff,0x8bf03a];
const HELM_TYPES = [{id:0,n:'Abierto'},{id:1,n:'Integral'},{id:2,n:'Cresta'}];

const MODES = [
  {id:'historia', n:'Campaña', d:'Recoge 5 núcleos y abate al jefe.'},
  {id:'1v1', n:'Duelo 1v1', d:'Combate espacial directo.'},
  {id:'2v2', n:'Escuadrón 2v2', d:'Vuela con un compañero.'}
];

const S = { faction:null, pilot:{name:'PILOTO', skin:0, helm:0, helmType:1}, ship:{hull:'escarabajo'}, mode:'1v1', screen:'title' };
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.random()*(b-a);

function toast(msg){
  const t=$('#toast'); t.innerHTML=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', 1800);
}
function setAccent(){ document.documentElement.style.setProperty('--f', S.faction? FACTIONS[S.faction].css : '#2fd4ff'); }

function show(id){
  S.screen=id;
  $$('.screen').forEach(s=>s.classList.remove('on'));
  const el=$('#sc'+id.charAt(0).toUpperCase()+id.slice(1));
  if(el) el.classList.add('on');
  $('#app').style.display='flex';
  $('#bg').style.display='block';
  $('#game').style.display='none';
  $('#hud').classList.remove('on');
  if(id==='pilot') startPilotPreview();
  if(id==='ship'){ startShipPreview(); renderShip(); }
}

function shipStats(hullId, factionId){
  const h=HULLS[hullId], f=FACTIONS[factionId]||FACTIONS.zylith;
  const s={...h.base};
  s.vel*=f.mods.vel; s.giro*=f.mods.giro; s.dano*=f.mods.dano;
  s.casco*=f.mods.casco; s.escudo*=f.mods.escudo;
  return s;
}

/* CONSTRUCTORES 3D (MORRO HACIA -Z) */
function mat(c,emi){ return new THREE.MeshLambertMaterial({color:c, emissive:emi||0, emissiveIntensity:emi?0.8:0}); }
function box(g,x,y,z,w,h,d,c,emi){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c,emi));
  m.position.set(x,y,z); g.add(m); return m;
}
function boxM(g,x,y,z,w,h,d,c,emi){ box(g,x,y,z,w,h,d,c,emi); box(g,-x,y,z,w,h,d,c,emi); }

function buildHead(p, fid){
  const g=new THREE.Group(), f=FACTIONS[fid]||FACTIONS.zylith;
  box(g,0,0,0,1.2,1.2,1.2,SKINS[p.skin]);
  if(p.helmType!==0){
    box(g,0,0.5,0,1.3,0.3,1.3,HELMS[p.helm]);
    boxM(g,0.6,0,0,0.2,1.0,1.3,HELMS[p.helm]);
  }
  if(p.helmType===1) box(g,0,0.1,0.65,1.1,0.35,0.15,0x2fd4ff,0x2fd4ff);
  if(p.helmType===2) box(g,0,0.8,0,0.2,0.4,1.4,f.hex3);
  return g;
}

// Las naves se construyen orientadas hacia -Z (hacia adelante por estándar Three.js)
function buildShip(hullId, fid, scale){
  const g=new THREE.Group(), f=FACTIONS[fid]||FACTIONS.zylith;
  const A=f.hex, B=f.hex2, C=f.hex3, GL=0x55d5ff;

  if(hullId==='escarabajo'){
    box(g,0,0,-0.2, 1.2,0.5,2.6, A);            // Fuselaje
    box(g,0,0.35,0, 0.8,0.3,1.4, B);            // Cabina sup
    box(g,0,0.2,-0.9, 0.5,0.25,0.6, GL,GL);     // Cristal
    boxM(g,1.1,0,0.1, 1.2,0.2,1.4, A);          // Alas
    boxM(g,0.45,0,1.35, 0.4,0.4,0.4, C,C);      // Motores
  } else if(hullId==='martillo'){
    box(g,0,0,0, 1.8,0.9,2.8, A);
    box(g,0,0.5,0.2, 1.2,0.4,1.8, B);
    box(g,0,0.3,-1.2, 0.6,0.3,0.6, GL,GL);
    boxM(g,1.3,0.1,-0.2, 0.9,0.6,2.0, B);
    boxM(g,0.6,-0.1,1.5, 0.5,0.5,0.5, C,C);
  } else {
    box(g,0,0,0, 0.6,0.5,3.4, A);
    box(g,0,0,-1.8, 0.3,0.25,1.0, C);
    box(g,0,0.22,-0.5, 0.4,0.25,0.6, GL,GL);
    boxM(g,0.7,0,0.4, 1.0,0.15,1.0, A);
    box(g,0,0,1.7, 0.5,0.5,0.5, C,C);
  }
  g.scale.setScalar(scale||1);
  return g;
}

/* PREVIEWS MENÚS */
let PV_PILOT=null, PV_SHIP=null;
function makePreview(canvas, stageEl){
  const r=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(38,1,0.1,100);
  cam.position.set(0,0.4,5);
  sc.add(new THREE.AmbientLight(0x8892c8,0.9));
  const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(4,6,6); sc.add(key);
  const pivot=new THREE.Group(); sc.add(pivot);
  const s={r,sc,cam,pivot};
  function resize(){
    const w=stageEl.clientWidth, h=stageEl.clientHeight;
    if(w<10) return;
    r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  }
  addEventListener('resize',resize);
  (function loop(){ requestAnimationFrame(loop); pivot.rotation.y+=0.01; r.render(sc,cam); })();
  setTimeout(resize,40);
  return s;
}
function startPilotPreview(){
  if(!PV_PILOT) PV_PILOT=makePreview($('#cvPilot'), $('#stagePilot'));
  PV_PILOT.pivot.clear();
  PV_PILOT.pivot.add(buildHead(S.pilot, S.faction));
}
function startShipPreview(){
  if(!PV_SHIP){
    PV_SHIP=makePreview($('#cvShip'), $('#stageShip'));
    PV_SHIP.cam.position.set(0,1.6,6.5); PV_SHIP.cam.lookAt(0,0,0);
  }
  PV_SHIP.pivot.clear();
  const sh=buildShip(S.ship.hull, S.faction, 1);
  sh.rotation.y = Math.PI; // En el menú mira de frente
  PV_SHIP.pivot.add(sh);
}

/* UI MENÚS */
function renderFactions(){
  const el=$('#factionList'); el.innerHTML='';
  FKEYS.forEach(k=>{
    const f=FACTIONS[k], d=document.createElement('div');
    d.className='blk fcard'+(S.faction===k?' sel':'');
    d.innerHTML=`<div class="crest" style="color:${f.css}">${f.crest}</div><div class="body"><h3 style="color:${f.css}">${f.name}</h3><div class="desc">${f.desc}</div></div>`;
    d.addEventListener('click',()=>{ S.faction=k; setAccent(); renderFactions(); $('#toPilot').disabled=false; });
    el.appendChild(d);
  });
}
function renderPilot(){
  const sSkin=$('#swSkin'); sSkin.innerHTML='';
  SKINS.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='sw'+(S.pilot.skin===i?' sel':''); d.style.background='#'+c.toString(16);
    d.addEventListener('click',()=>{ S.pilot.skin=i; renderPilot(); startPilotPreview(); });
    sSkin.appendChild(d);
  });
  const oHelm=$('#opHelm'); oHelm.innerHTML='';
  HELM_TYPES.forEach(o=>{
    const d=document.createElement('div'); d.className='opt'+(S.pilot.helmType===o.id?' sel':''); d.textContent=o.n;
    d.addEventListener('click',()=>{ S.pilot.helmType=o.id; renderPilot(); startPilotPreview(); });
    oHelm.appendChild(d);
  });
}
function renderShip(){
  const hl=$('#hullList'); hl.innerHTML='';
  HKEYS.forEach(k=>{
    const h=HULLS[k], d=document.createElement('div');
    d.className='hull'+(S.ship.hull===k?' sel':''); d.innerHTML=`<span class="n">${h.name}</span>`;
    d.addEventListener('click',()=>{ S.ship.hull=k; renderShip(); startShipPreview(); });
    hl.appendChild(d);
  });
  const st=shipStats(S.ship.hull, S.faction), sl=$('#statList'); sl.innerHTML='';
  [ {k:'vel',n:'Velocidad',m:45}, {k:'casco',n:'Casco',m:240}, {k:'dano',n:'Daño',m:25} ].forEach(m=>{
    const v=st[m.k], row=document.createElement('div'); row.className='stat';
    row.innerHTML=`<span>${m.n}</span><div class="bar"><i style="width:${clamp(v/m.m*100,0,100)}%"></i></div><span class="v">${Math.round(v)}</span>`;
    sl.appendChild(row);
  });
}
function renderModes(){
  const el=$('#modeList'); el.innerHTML='';
  MODES.forEach(m=>{
    const d=document.createElement('div'); d.className='blk mcard';
    d.innerHTML=`<h3>${m.n}</h3><p>${m.d}</p>`;
    d.addEventListener('click',()=>{ S.mode=m.id; startBattle(); });
    el.appendChild(d);
  });
}

/* ============================================================
   COMBATE CON JOYSTICK Y CÁMARA HIJA (NAVE SIEMPRE EN EL CENTRO)
============================================================ */
const G = {
  renderer:null, scene:null, cam:null, clock:null,
  player:null, actors:[], bullets:[], parts:[], pickups:[], markers:[],
  running:false, over:false, kills:0, cores:0, coresNeeded:5, bossUp:false,
  keys:{},
  stick:{ x:0, y:0 }, // Ejes analógicos (-1 a 1)
  btnShoot:false,
  btnTurbo:false
};

function buildSpaceWorld(){
  const sc=G.scene;
  sc.background=new THREE.Color(0x060817);
  sc.fog=new THREE.FogExp2(0x080a1c, 0.0015);
  sc.add(new THREE.AmbientLight(0xb0b8e8, 1.0));
  const sun=new THREE.DirectionalLight(0xfff0d0, 1.3); sun.position.set(-200,300,-200); sc.add(sun);

  // Estrellas
  const sg=new THREE.BufferGeometry(), pos=[];
  for(let i=0;i<1500;i++){
    const v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(1000,1600));
    pos.push(v.x,v.y,v.z);
  }
  sg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  sc.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff,size:3.5})));

  // Planeta
  const planet=new THREE.Mesh(new THREE.SphereGeometry(220,16,12), new THREE.MeshLambertMaterial({color:0x274d6e}));
  planet.position.set(-450,-120,-700); sc.add(planet);

  // Asteroides
  G.rocks=[];
  for(let i=0;i<32;i++){
    const g=new THREE.Group();
    box(g,0,0,0,rnd(10,20),rnd(10,20),rnd(10,20),0x484e68);
    const a=Math.random()*Math.PI*2, r=rnd(150,450);
    g.position.set(Math.cos(a)*r, rnd(-80,80), Math.sin(a)*r);
    sc.add(g); G.rocks.push(g);
  }
}

function makeActor(cfg){
  const st=shipStats(cfg.hull, cfg.faction);
  const mesh=buildShip(cfg.hull, cfg.faction, cfg.scale||1.4);
  const holder=new THREE.Group();
  holder.add(mesh);
  holder.position.copy(cfg.pos);
  G.scene.add(holder);

  const a={
    obj:holder, mesh, team:cfg.team, faction:cfg.faction, isPlayer:!!cfg.isPlayer,
    stats:st, hull:st.casco, hullMax:st.casco, shield:st.escudo, shieldMax:st.escudo,
    cool:0, dead:false, speed:st.vel*(cfg.speedMul||1),
    boss:!!cfg.boss, name:cfg.name
  };
  G.actors.push(a);
  return a;
}

function makeMarker(cls,lbl){
  const d=document.createElement('div'); d.className='marker '+cls;
  d.innerHTML='<div class="d">'+lbl+'</div>';
  $('#hud').appendChild(d); G.markers.push(d);
  return d;
}

// Disparos grandes, luminosos y hacia adelante (-Z)
const BULLET_GEO = new THREE.BoxGeometry(1.2, 1.2, 7.0);
function fire(a){
  const dmg = a.stats.dano;
  // Dirección de avance (-Z local)
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(a.obj.quaternion);

  [-2.0, 2.0].forEach(sideOffset=>{
    const col = a.faction==='krovax'? 0xff6b2b : (a.faction==='mycor'? 0x8bf03a : 0x2fd4ff);
    const m = new THREE.Mesh(BULLET_GEO, new THREE.MeshBasicMaterial({color:col}));
    
    // Salen de las alas hacia adelante
    const side = new THREE.Vector3(1,0,0).applyQuaternion(a.obj.quaternion).multiplyScalar(sideOffset);
    m.position.copy(a.obj.position).add(side).add(dir.clone().multiplyScalar(2.0));
    m.quaternion.copy(a.obj.quaternion);
    
    G.scene.add(m);
    G.bullets.push({
      obj:m,
      v:dir.clone().multiplyScalar(240),
      life:2.5,
      dmg:dmg,
      team:a.team,
      from:a.faction
    });
  });
}

function burst(pos, color, n){
  for(let i=0;i<(n||12);i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(2.5,2.5,2.5), new THREE.MeshBasicMaterial({color}));
    m.position.copy(pos); G.scene.add(m);
    G.parts.push({obj:m, v:new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(15,40)), life:0.8});
  }
}

function damage(a, val){
  if(a.dead) return;
  if(a.shield>0){
    const ab=Math.min(a.shield,val); a.shield-=ab; val-=ab;
  }
  a.hull-=val;
  if(a.hull<=0){
    a.dead=true; burst(a.obj.position, FACTIONS[a.faction].hex, 28);
    G.scene.remove(a.obj);
    if(a.marker) a.marker.style.display='none';
    if(a.isPlayer) endBattle(false);
    else if(a.team===2){
      G.kills++;
      if(a.boss || !G.actors.some(x=>x.team===2 && !x.dead)) endBattle(true);
    }
  }
}

function playerUpdate(a, dt){
  const k=G.keys;
  let yaw = -G.stick.x;   // Stick horizontal gira la nave
  let pitch = -G.stick.y; // Stick vertical sube / baja

  // Soporte teclado para PC
  if(k['a']||k['arrowleft'])  yaw += 1;
  if(k['d']||k['arrowright']) yaw -= 1;
  if(k['w']||k['arrowup'])    pitch += 1;
  if(k['s']||k['arrowdown'])  pitch -= 1;

  // Rotaciones directas y fluidas
  const rate = a.stats.giro * dt * 1.5;
  const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw * rate);
  const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch * rate);
  a.obj.quaternion.multiply(qy).multiply(qx);

  // Avance frontal constante (-Z)
  const boosting = G.btnTurbo || k['shift'];
  const sp = a.speed * (boosting ? 1.9 : 1.0);
  const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(a.obj.quaternion);
  a.obj.position.add(fwd.multiplyScalar(sp*dt));

  // Alabeo visual de la nave
  a.mesh.rotation.z = THREE.MathUtils.lerp(a.mesh.rotation.z, -yaw * 0.5, dt * 7);

  // Disparo
  a.cool -= dt;
  if((G.btnShoot || k[' ']) && a.cool<=0){
    a.cool = 1 / a.stats.cad;
    fire(a);
  }

  // Recogida de cristales
  for(let i=G.pickups.length-1;i>=0;i--){
    const p=G.pickups[i];
    if(p.obj.position.distanceTo(a.obj.position)<26){
      burst(p.obj.position, 0xffd24a, 16);
      G.scene.remove(p.obj); p.marker.remove();
      G.pickups.splice(i,1);
      G.cores++; toast('NÚCLEO '+G.cores+' / '+G.coresNeeded);
      if(G.cores>=G.coresNeeded && !G.bossUp) spawnBoss();
    }
  }
}

function spawnBoss(){
  G.bossUp=true;
  const ef=FACTIONS[S.faction].weak;
  const pos=G.player.obj.position.clone().add(new THREE.Vector3(0,25,-220));
  const b=makeActor({hull:'martillo', faction:ef, pos, team:2, name:'GUARDIÁN', boss:true, scale:3.2});
  b.hullMax*=3.5; b.hull=b.hullMax;
  b.marker=makeMarker('','GUARDIÁN');
  toast('¡GUARDIÁN ACTIVADO!');
}

function startBattle(){
  $('#app').style.display='none';
  $('#bg').style.display='none';
  $('#game').style.display='block';
  $('#hud').classList.add('on');
  G.markers.forEach(m=>m.remove()); G.markers=[];

  if(!G.renderer){
    G.renderer=new THREE.WebGLRenderer({canvas:$('#game'), antialias:true});
    G.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  }
  G.renderer.setSize(innerWidth,innerHeight,false);
  G.scene=new THREE.Scene();

  // Cámara con FOV amplio para vista panorámica apaisada
  G.cam=new THREE.PerspectiveCamera(54, innerWidth/innerHeight, 0.5, 3000);
  G.clock=new THREE.Clock();
  G.actors=[]; G.bullets=[]; G.parts=[]; G.pickups=[];
  G.kills=0; G.cores=0; G.bossUp=false; G.over=false;

  buildSpaceWorld();

  // 1. Crear jugador en el centro
  G.player=makeActor({hull:S.ship.hull, faction:S.faction, pos:new THREE.Vector3(0,0,0), team:1, isPlayer:true});

  // 2. FIJAR CÁMARA COMO HIJA DE LA NAVE:
  // Siempre 3.8 unidades arriba y 14.5 unidades por detrás (+Z)
  // Mirando directamente al frente por encima del morro hacia el retículo
  G.cam.position.set(0, 3.8, 14.5);
  G.cam.lookAt(0, 0.8, -30);
  G.player.obj.add(G.cam);

  if(S.mode==='historia'){
    G.coresNeeded=5;
    for(let i=0;i<5;i++){
      const a=Math.random()*Math.PI*2, r=rnd(180,400);
      const g=new THREE.Group();
      box(g,0,0,0,5,5,5,0xffd24a,0xffd24a);
      g.position.set(Math.cos(a)*r, rnd(-30,30), Math.sin(a)*r);
      G.scene.add(g);
      G.pickups.push({obj:g, marker:makeMarker('pick','NÚCLEO')});
    }
    const e=makeActor({hull:'aguja', faction:FACTIONS[S.faction].strong, pos:new THREE.Vector3(0,0,-220), team:2});
    e.marker=makeMarker('','ENEMIGO');
    $('#objT').textContent='CAMPAÑA: 5 NÚCLEOS';
  } else {
    const e=makeActor({hull:'escarabajo', faction:FACTIONS[S.faction].strong, pos:new THREE.Vector3(0,0,-220), team:2});
    e.marker=makeMarker('','ENEMIGO');
    $('#objT').textContent='DUELO';
  }

  G.running=true;
  requestAnimationFrame(frame);
}

function frame(){
  if(!G.running) return;
  requestAnimationFrame(frame);
  const dt=Math.min(G.clock.getDelta(),0.05);

  G.actors.forEach(a=>{
    if(a.dead) return;
    if(a.isPlayer) playerUpdate(a,dt);
    else {
      // IA básica de persecución
      const toP=G.player.obj.position.clone().sub(a.obj.position);
      const mRot=new THREE.Matrix4().lookAt(a.obj.position, G.player.obj.position, new THREE.Vector3(0,1,0));
      a.obj.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(mRot), dt*1.2);
      a.obj.position.add(new THREE.Vector3(0,0,-1).applyQuaternion(a.obj.quaternion).multiplyScalar(a.speed*0.8*dt));
      a.cool-=dt;
      if(toP.length()<280 && a.cool<=0){ a.cool=1/a.stats.cad; fire(a); }
    }
  });

  // Balas
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.life-=dt;
    b.obj.position.add(b.v.clone().multiplyScalar(dt));
    let hit=false;
    for(const a of G.actors){
      if(a.dead || a.team===b.team) continue;
      if(b.obj.position.distanceTo(a.obj.position)<(a.boss?32:11)){
        damage(a, b.dmg); burst(b.obj.position, FACTIONS[b.from].hex, 6);
        hit=true; break;
      }
    }
    if(hit || b.life<=0){ G.scene.remove(b.obj); G.bullets.splice(i,1); }
  }

  // Partículas
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.life-=dt; p.obj.position.add(p.v.clone().multiplyScalar(dt));
    if(p.life<=0){ G.scene.remove(p.obj); G.parts.splice(i,1); }
  }

  // HUD
  const pl=G.player;
  if(pl && !pl.dead){
    $('#bHull').querySelector('i').style.width=(clamp(pl.hull/pl.hullMax,0,1)*100)+'%';
    $('#bShield').querySelector('i').style.width=(clamp(pl.shield/Math.max(1,pl.shieldMax),0,1)*100)+'%';
    $('#hullTxt').textContent=Math.max(0,Math.round(pl.hull));
    $('#shTxt').textContent=Math.max(0,Math.round(pl.shield));
  }

  // Marcadores en pantalla
  const v=new THREE.Vector3();
  G.actors.concat(G.pickups).forEach(item=>{
    const m=item.marker; if(!m) return;
    if(item.dead){ m.style.display='none'; return; }
    v.copy(item.obj.position).project(G.cam);
    const on=v.z<1 && v.x>-1 && v.x<1 && v.y>-1 && v.y<1;
    m.style.display=on?'block':'none';
    if(on){
      m.style.left=((v.x*0.5+0.5)*innerWidth)+'px';
      m.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';
      m.querySelector('.d').textContent=Math.round(item.obj.position.distanceTo(G.player.obj.position))+'m';
    }
  });

  G.renderer.render(G.scene, G.cam);
}

function endBattle(win){
  if(G.over) return;
  G.over=true; G.running=false;
  setTimeout(()=>{
    $('#hud').classList.remove('on');
    $('#game').style.display='none';
    G.markers.forEach(m=>m.remove()); G.markers=[];
    $('#rTitle').textContent = win? '¡SECTOR ASEGURADO!' : 'NAVE DERRIBADA';
    $('#rTitle').style.color = win? 'var(--gold)' : 'var(--danger)';
    show('result');
  }, 900);
}

/* ============================================================
   CONTROL DEL JOYSTICK TÁCTIL (THUMBSTICK)
============================================================ */
const stickArea = $('#stickArea');
const stickKnob = $('#stickKnob');
let touchId = null;
let center = { x:0, y:0 };
const MAX_RADIUS = 46;

stickArea.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(touchId !== null) return;
  const t = e.changedTouches[0];
  touchId = t.identifier;
  const rect = stickArea.getBoundingClientRect();
  center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  updateJoystick(t.clientX, t.clientY);
}, {passive:false});

window.addEventListener('touchmove', e=>{
  if(touchId === null) return;
  for(let i=0; i<e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.identifier === touchId){
      updateJoystick(t.clientX, t.clientY);
      break;
    }
  }
}, {passive:false});

const releaseStick = e=>{
  if(touchId === null) return;
  for(let i=0; i<e.changedTouches.length; i++){
    if(e.changedTouches[i].identifier === touchId){
      touchId = null;
      G.stick.x = 0;
      G.stick.y = 0;
      stickKnob.style.transform = 'translate3d(0,0,0)';
      break;
    }
  }
};
window.addEventListener('touchend', releaseStick, {passive:false});
window.addEventListener('touchcancel', releaseStick, {passive:false});

function updateJoystick(clientX, clientY){
  let dx = clientX - center.x;
  let dy = clientY - center.y;
  const dist = Math.hypot(dx, dy);

  if(dist > MAX_RADIUS){
    dx = (dx / dist) * MAX_RADIUS;
    dy = (dy / dist) * MAX_RADIUS;
  }

  stickKnob.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
  // Normalizar entre -1 y 1
  G.stick.x = dx / MAX_RADIUS;
  G.stick.y = dy / MAX_RADIUS;
}

/* ============================================================
   BOTONES DE ACCIÓN (DERECHA)
============================================================ */
function bindBtn(id, key){
  const el = $(id);
  const press = ()=>{ G[key] = true; el.classList.add('down'); };
  const release = ()=>{ G[key] = false; el.classList.remove('down'); };

  el.addEventListener('touchstart', e=>{ e.preventDefault(); press(); }, {passive:false});
  el.addEventListener('touchend',   e=>{ e.preventDefault(); release(); }, {passive:false});
  el.addEventListener('touchcancel',e=>{ e.preventDefault(); release(); }, {passive:false});

  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}

bindBtn('#btnShoot', 'btnShoot');
bindBtn('#btnTurbo', 'btnTurbo');

$('#btnHeal').addEventListener('touchstart', e=>{
  e.preventDefault();
  if(G.running && G.player && !G.player.dead){
    G.player.hull = Math.min(G.player.hullMax, G.player.hull + 45);
    G.player.shield = G.player.shieldMax;
    toast('¡PODER ACTIVADO!');
  }
}, {passive:false});

$('#tQuit').addEventListener('click',()=>{ G.running=false; G.over=true; show('mode'); });

addEventListener('keydown', e=>{ G.keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e=>{ G.keys[e.key.toLowerCase()] = false; });

window.addEventListener('resize',()=>{
  if(G.renderer && G.cam){
    G.renderer.setSize(innerWidth, innerHeight, false);
    G.cam.aspect = innerWidth / innerHeight;
    G.cam.updateProjectionMatrix();
  }
});

$$('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));
$('#toPilot').addEventListener('click',()=>{ if(S.faction) show('pilot'); });
$('#rAgain').addEventListener('click',()=>startBattle());

renderFactions();
renderPilot();
renderModes();
setAccent();
</script>
